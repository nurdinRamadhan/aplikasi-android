name: Build & Release APK/AAB

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystores.jks

      - name: Create local.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AHMAD_SANUSI_API_KEY: ${{ secrets.AHMAD_SANUSI_API_KEY }}
        run: |
          echo "release.keystore=$GITHUB_WORKSPACE/keystores.jks" >> local.properties
          echo "release.keystore.password=$RELEASE_KEYSTORE_PASSWORD" >> local.properties
          echo "release.key.alias=$RELEASE_KEY_ALIAS" >> local.properties
          echo "release.key.password=$RELEASE_KEY_PASSWORD" >> local.properties
          echo "supabase.url=$SUPABASE_URL" >> local.properties
          echo "supabase.anon.key=$SUPABASE_ANON_KEY" >> local.properties
          echo "ahmadsanusi.api.key=$AHMAD_SANUSI_API_KEY" >> local.properties

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "VERSION_NAME=$TAG" >> $GITHUB_ENV
          # versionCode = angka versi utama tanpa titik, misal 1.0.0 -> 100
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3)
          VCODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION_CODE=$VCODE" >> $GITHUB_ENV

      - name: Build AAB & APK
        run: |
          ./gradlew bundleRelease assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }}

      - name: Sign APK (pastikan sudah ditandatangani build)
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/AlhasanahMedia-v${{ env.VERSION_NAME }}.apk

      - name: Rename AAB
        run: |
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/AlhasanahMedia-v${{ env.VERSION_NAME }}.aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Alhasanah Media v${{ env.VERSION_NAME }}
          body: |
            ## Alhasanah Media v${{ env.VERSION_NAME }}

            ### File
            - `AlhasanahMedia-v${{ env.VERSION_NAME }}.apk` —可直接安装的 APK
            - `AlhasanahMedia-v${{ env.VERSION_NAME }}.aab` —Google Play AAB

            ### Cara Install APK
            1. Download file `.apk`
            2. Buka di HP Android → izinkan instal dari sumber tidak dikenal
            3. Install
          files: |
            app/build/outputs/apk/release/AlhasanahMedia-v${{ env.VERSION_NAME }}.apk
            app/build/outputs/bundle/release/AlhasanahMedia-v${{ env.VERSION_NAME }}.aab
